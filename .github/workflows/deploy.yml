# Why this exists. The release version used to be a YYYYMMDD-NN string typed by
# hand into four files that all had to agree. Twice it was not: commits d7a92e2
# and cb5962c shipped real code with the stamp untouched, so sw.js's CACHE_NAME
# never changed, no new worker installed, and every existing install kept being
# served the previous bundle cache-first. Neither is visible on localhost, where
# the worker is deliberately unregistered. A CI check policed that, but a check
# that fires after you already typed the wrong thing is a worse answer than not
# typing it at all — and the date inside the stamp was fiction regardless,
# whatever the author happened to type rather than when anything shipped.
#
# So the repo carries placeholders and this job substitutes the real commit SHA
# and the real commit timestamp at publish time. The version cannot drift (one
# sed writes every occurrence), cannot be forgotten (the SHA changes on every
# commit by construction), and identifies a commit you can actually look up.
#
# The stamped tree is uploaded, never committed back, so the SHA in the deployed
# files is exactly the commit that produced them.
#
# NOTE: this requires repo Settings -> Pages -> Source = "GitHub Actions".
# With Source still set to "Deploy from a branch", Pages serves the unstamped
# repo files and every asset URL is literally "?v=__BUILD__".

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a half-published release is a mixed build for
# whoever loads during the overlap.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Stamp the build with this commit
        shell: bash
        run: |
          set -euo pipefail

          sha="${GITHUB_SHA:0:7}"
          build_time="$(git show -s --format=%cI "$GITHUB_SHA")"

          # An empty or malformed sha would sed the placeholders into nothing
          # and ship a build whose version is the empty string — which compares
          # unequal to everything and would put every install into a permanent
          # "update available" loop. Refuse instead.
          if ! printf '%s' "$sha" | grep -qE '^[0-9a-f]{7}$'; then
            echo "::error::Refusing to deploy: '$sha' is not a 7-character commit sha."
            exit 1
          fi
          if [ -z "$build_time" ]; then
            echo "::error::Refusing to deploy: could not read the commit timestamp."
            exit 1
          fi

          # Guard: the placeholders must be exactly where they belong, and
          # nowhere else.
          #
          # "Where they belong" catches someone hand-writing a version back into
          # one of these — the files would then ship disagreeing with each other
          # and the whole point would be lost.
          #
          # "Nowhere else" is the half that is easy to miss: the sed below is a
          # blind global replace, so a code COMMENT that spells the placeholder
          # out gets rewritten into a commit sha too. Harmless in prose, not
          # harmless in `BUILD_STAMP === "__" + "BUILD__"`, which is written
          # split precisely so it survives. Counting matching lines per file
          # (the first version of this check) conflated the two and failed with
          # a count nobody could act on.
          # -a on every grep below, without exception. The app source contains
          # two NUL bytes (the `.neq("id", "\0")` match-everything sentinels in
          # the delete path), so grep classifies that file as binary and,
          # instead of reporting matches, prints "binary file matches" and moves
          # on. That made the occurrence count silently read 4 when it was
          # really 5 — on the single file most likely to gain a stray mention of
          # a placeholder.
          require_one() {
            local file="$1" fragment="$2" n
            n=$(grep -aFc -- "$fragment" "$file" || true)
            if [ "$n" -ne 1 ]; then
              echo "::error file=$file::Expected exactly one occurrence of: $fragment (found $n)"
              echo "::error file=$file::Do not write a version into this by hand — this job does it."
              exit 1
            fi
          }

          # Every file the substitution touches. app.js became src/main.js and
          # then a tree of modules, so this is a glob rather than a fixed list.
          mapfile -t STAMPED < <(printf '%s\n' index.html sw.js; find src -name '*.js' | sort)
          # styles/*.css carry no placeholder themselves — only the <link> and
          # APP_SHELL URLs that point at them do — so they are not stamped
          # files, but every one must be referenced from both.
          echo "stamping ${#STAMPED[@]} files"

          require_one index.html 'src/main.js?v=__BUILD__'
          require_one sw.js             'const CACHE_NAME = "recall-__BUILD__";'
          require_one src/core/build.js 'export const BUILD_STAMP = "__BUILD__";'
          require_one src/core/build.js 'export const BUILD_TIME = "__BUILD_TIME__";'

          # Every relative import in src/ must carry the stamp. This is the half
          # that a fixed occurrence count can no longer do, and it matters more
          # than the count ever did: an unstamped `import "./notes/toc.js"` has a
          # URL that does not change between releases, so a cache-first worker
          # (or the browser's own HTTP cache) can serve the PREVIOUS release's
          # copy of it to the current release's main.js. That is the mixed-build
          # failure this repo has already shipped twice, and it would be silent.
          if unstamped=$(grep -rniE 'from[[:space:]]*"\.\.?/[^"]*\.js"' src/ 2>/dev/null); then
            echo "::error::A relative import in src/ is missing ?v=__BUILD__:"
            echo "$unstamped"
            echo "::error::Write it as: from \"./thing.js?v=__BUILD__\""
            exit 1
          fi

          # "Nowhere else": every __BUILD__ must be in one of the three shapes
          # the substitution is meant to produce. A count can't do this any more
          # (the number of imports changes with every module added) and this is
          # a stronger check regardless — it catches a placeholder spelled out in
          # a comment, which sed would blindly rewrite into a commit sha.
          # `?v=__BUILD__` (asset + import URLs), `recall-__BUILD__` (CACHE_NAME)
          # and `"__BUILD__"` (build.js). The split form in build.js's
          # IS_DEV_BUILD comparison is invisible here by construction.
          stray=$(grep -aon '__BUILD__' "${STAMPED[@]}" \
            | while IFS=: read -r f l _; do
                sed -n "${l}p" "$f" | grep -aq '?v=__BUILD__\|recall-__BUILD__\|"__BUILD__"' || echo "$f:$l"
              done)
          if [ -n "$stray" ]; then
            echo "::error::__BUILD__ appears somewhere it should not — most likely spelled out in a comment."
            echo "::error::sed would rewrite it into a commit sha. Reword it, or split the string as IS_DEV_BUILD's comparison does."
            echo "$stray"
            exit 1
          fi

          build_total=$(grep -ao '__BUILD__' "${STAMPED[@]}" | wc -l)
          time_total=$(grep -ao '__BUILD_TIME__' "${STAMPED[@]}" | wc -l)
          echo "placeholders: __BUILD__ x$build_total, __BUILD_TIME__ x$time_total (want 1)"
          if [ "$time_total" -ne 1 ]; then
            echo "::error::__BUILD_TIME__ must appear exactly once (in src/core/build.js)."
            grep -an '__BUILD_TIME__' "${STAMPED[@]}" || true
            exit 1
          fi

          sed -i "s/__BUILD__/$sha/g" "${STAMPED[@]}"
          sed -i "s|__BUILD_TIME__|$build_time|g" src/core/build.js

          # Nothing may be left over anywhere in the deployed tree.
          if grep -an '__BUILD__\|__BUILD_TIME__' "${STAMPED[@]}"; then
            echo "::error::A placeholder survived substitution."
            exit 1
          fi

          # vendor/ is a deliberately UNSTAMPED category. Those files carry
          # their library's version in the path, so their URLs are already
          # immutable — stamping them would change the URL on every release and
          # defeat the whole reason they live in a cache the release sweep
          # spares. Two things must hold instead: nothing in vendor/ may carry a
          # ?v=, and every file in it must be precached.
          if stamped_vendor=$(grep -rn 'vendor/[^"]*?v=' index.html sw.js 2>/dev/null); then
            echo "::error::A vendor/ URL carries a ?v= stamp. Its version is in the path already:"
            echo "$stamped_vendor"
            exit 1
          fi
          missing=""
          while read -r f; do
            grep -qF "\"./$f\"" sw.js || missing="$missing $f"
          done < <(find vendor -type f ! -name lock.json | sort)
          if [ -n "$missing" ]; then
            echo "::error::These vendored files are not in sw.js VENDOR_ASSETS:$missing"
            echo "::error::Run: node tools/vendor-sync.mjs"
            exit 1
          fi

          # And nothing on the boot path may be a third-party request. This is
          # the check that would have caught the failure this whole area was
          # rebuilt for: index.html loaded eight parser-blocking scripts and two
          # render-blocking stylesheets from cdn.jsdelivr.net, so a CDN that
          # merely hung gave every user a permanent blank page — and no test
          # anywhere said it should not.
          # Anchored at the start of the line, which is what distinguishes a
          # real tag (always indented on its own line) from this file's own
          # prose about the tags it used to have. A multi-line HTML comment
          # cannot be stripped with sed, and trying was a guaranteed false
          # positive on the very comment that explains the rule.
          if third_party=$(grep -nE '^[[:space:]]*<(script src|link rel="stylesheet" href)="https://' index.html); then
            echo "::error::index.html loads a blocking third-party asset. Vendor it (tools/vendor-sync.mjs):"
            echo "$third_party"
            exit 1
          fi

          # Every module on disk must be precached by the worker. A module the
          # worker does not know about still WORKS — the miss handler fetches
          # and caches it — but it is absent on a first offline launch, which is
          # the one case the precache exists for.
          missing=""
          while read -r f; do
            grep -qF "./$f?v=" sw.js || missing="$missing $f"
          done < <(find src -name '*.js' | sort)
          if [ -n "$missing" ]; then
            echo "::error::These modules are not in sw.js APP_SHELL:$missing"
            exit 1
          fi

          # And every module except the entry point needs a <link
          # rel="modulepreload">. Without one the browser cannot ask for a
          # module until it has parsed whichever module imports it, and the
          # deepest chain here is 66 hops — on a first load that is dozens of
          # sequential round trips. Both lists are generated by
          # tools/extract-module.mjs; this is here so a hand-added module
          # cannot quietly skip them.
          missing=""
          while read -r f; do
            [ "$f" = "src/main.js" ] && continue
            grep -qF "modulepreload\" href=\"$f?v=" index.html || missing="$missing $f"
          done < <(find src -name '*.js' | sort)
          if [ -n "$missing" ]; then
            echo "::error::These modules have no <link rel=\"modulepreload\"> in index.html:$missing"
            exit 1
          fi

          # Same for the stylesheets. styles.css was split into ordered slices
          # whose ORDER is the cascade: a missing <link> silently drops a
          # section of the app's styling, and a missing APP_SHELL entry drops
          # it only when offline.
          missing=""
          while read -r f; do
            grep -qF "stylesheet\" href=\"$f?v=" index.html || missing="$missing $f(link)"
            grep -qF "./$f?v=" sw.js || missing="$missing $f(sw)"
          done < <(find styles -name '*.css' | sort)
          if [ -n "$missing" ]; then
            echo "::error::Stylesheet not referenced:$missing"
            exit 1
          fi

          echo "Deploying $sha ($build_time)"
          grep -o 'src/main\.js?v=[^"]*' index.html
          grep '^const CACHE_NAME' sw.js

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v5
