# Why this exists. The release version used to be a YYYYMMDD-NN string typed by
# hand into four files that all had to agree. Twice it was not: commits d7a92e2
# and cb5962c shipped real code with the stamp untouched, so sw.js's CACHE_NAME
# never changed, no new worker installed, and every existing install kept being
# served the previous bundle cache-first. Neither is visible on localhost, where
# the worker is deliberately unregistered. A CI check policed that, but a check
# that fires after you already typed the wrong thing is a worse answer than not
# typing it at all — and the date inside the stamp was fiction regardless,
# whatever the author happened to type rather than when anything shipped.
#
# So the repo carries placeholders and this job substitutes the real commit SHA
# and the real commit timestamp at publish time. The version cannot drift (one
# sed writes every occurrence), cannot be forgotten (the SHA changes on every
# commit by construction), and identifies a commit you can actually look up.
#
# The stamped tree is uploaded, never committed back, so the SHA in the deployed
# files is exactly the commit that produced them.
#
# NOTE: this requires repo Settings -> Pages -> Source = "GitHub Actions".
# With Source still set to "Deploy from a branch", Pages serves the unstamped
# repo files and every asset URL is literally "?v=__BUILD__".

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a half-published release is a mixed build for
# whoever loads during the overlap.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Stamp the build with this commit
        shell: bash
        run: |
          set -euo pipefail

          sha="${GITHUB_SHA:0:7}"
          build_time="$(git show -s --format=%cI "$GITHUB_SHA")"

          # An empty or malformed sha would sed the placeholders into nothing
          # and ship a build whose version is the empty string — which compares
          # unequal to everything and would put every install into a permanent
          # "update available" loop. Refuse instead.
          if ! printf '%s' "$sha" | grep -qE '^[0-9a-f]{7}$'; then
            echo "::error::Refusing to deploy: '$sha' is not a 7-character commit sha."
            exit 1
          fi
          if [ -z "$build_time" ]; then
            echo "::error::Refusing to deploy: could not read the commit timestamp."
            exit 1
          fi

          # Guard: the placeholders must be exactly where they belong, and
          # nowhere else.
          #
          # "Where they belong" catches someone hand-writing a version back into
          # one of these — the files would then ship disagreeing with each other
          # and the whole point would be lost.
          #
          # "Nowhere else" is the half that is easy to miss: the sed below is a
          # blind global replace, so a code COMMENT that spells the placeholder
          # out gets rewritten into a commit sha too. Harmless in prose, not
          # harmless in `BUILD_STAMP === "__" + "BUILD__"`, which is written
          # split precisely so it survives. Counting matching lines per file
          # (the first version of this check) conflated the two and failed with
          # a count nobody could act on.
          # -a on every grep below, without exception. app.js contains two NUL
          # bytes (the `.neq("id", "\0")` match-everything sentinels in the
          # delete path), so grep classifies it as binary and, instead of
          # reporting matches, prints "binary file matches" and moves on. That
          # made the occurrence count silently read 4 when it was really 5 — on
          # the single file most likely to gain a stray mention of a placeholder.
          require_one() {
            local file="$1" fragment="$2" n
            n=$(grep -aFc -- "$fragment" "$file" || true)
            if [ "$n" -ne 1 ]; then
              echo "::error file=$file::Expected exactly one occurrence of: $fragment (found $n)"
              echo "::error file=$file::Do not write a version into this by hand — this job does it."
              exit 1
            fi
          }

          require_one index.html 'styles.css?v=__BUILD__'
          require_one index.html 'app.js?v=__BUILD__'
          require_one sw.js     'const CACHE_NAME = "recall-__BUILD__";'
          require_one app.js    'const BUILD_STAMP = "__BUILD__";'
          require_one app.js    'const BUILD_TIME = "__BUILD_TIME__";'

          # -o counts occurrences rather than lines, so two on one line cannot
          # hide. 4 x __BUILD__ (2 html, 1 sw, 1 js) and 1 x __BUILD_TIME__.
          build_total=$(grep -ao '__BUILD__' index.html sw.js app.js | wc -l)
          time_total=$(grep -ao '__BUILD_TIME__' index.html sw.js app.js | wc -l)
          echo "placeholders: __BUILD__ x$build_total (want 4), __BUILD_TIME__ x$time_total (want 1)"

          if [ "$build_total" -ne 4 ] || [ "$time_total" -ne 1 ]; then
            echo "::error::A placeholder appears somewhere it should not — most likely spelled out in a comment."
            echo "::error::sed would rewrite it into a commit sha. Reword it, or split the string as BUILD_STAMP's comparison does."
            grep -an '__BUILD__\|__BUILD_TIME__' index.html sw.js app.js || true
            exit 1
          fi

          sed -i "s/__BUILD__/$sha/g" index.html sw.js app.js
          sed -i "s|__BUILD_TIME__|$build_time|g" app.js

          # Nothing may be left over anywhere in the deployed tree.
          if grep -an '__BUILD__\|__BUILD_TIME__' index.html sw.js app.js; then
            echo "::error::A placeholder survived substitution."
            exit 1
          fi

          echo "Deploying $sha ($build_time)"
          grep -o '\(app\.js\|styles\.css\)?v=[^"]*' index.html
          grep '^const CACHE_NAME' sw.js

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v5
